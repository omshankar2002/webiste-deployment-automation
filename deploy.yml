
---
- name: Install Docker and deploy website using Nginx
  hosts: server
  connection: local
  become: true

  tasks:
    - name: Refresh APT package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Docker
      ansible.builtin.apt:
        name: docker.io
        state: present

    - name: Enable and start Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu user to Docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Check Dockerfile exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/Dockerfile"
      register: dockerfile_check

    - name: Stop if Dockerfile is missing
      ansible.builtin.fail:
        msg: "Dockerfile not found in the project directory"
      when: not dockerfile_check.stat.exists

    - name: Build Nginx website image
      ansible.builtin.command:
        cmd: docker build -t my-website:latest -f "{{ playbook_dir }}/Dockerfile" "{{ playbook_dir }}"
      changed_when: true

    - name: Remove existing website container
      ansible.builtin.command:
        cmd: docker rm -f my-website
      failed_when: false
      changed_when: false

    - name: Run Nginx website container
      ansible.builtin.command:
        cmd: docker run -d --name my-website --restart unless-stopped -p 80:80 my-website:latest

    - name: Verify website response
      ansible.builtin.uri:
        url: http://localhost
        status_code: 200
      register: website_response
      retries: 5
      delay: 2
      until: website_response.status == 200

